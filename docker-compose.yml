services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # в compose redis — отдельный сервис (перекрывает REDIS_HOST из .env)
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # по умолчанию только loopback. Для webhook за reverse-proxy на этом хосте
      # этого достаточно; для прямого публичного доступа: NOWYM_BIND_HOST=0.0.0.0
      - "${NOWYM_BIND_HOST:-127.0.0.1}:8443:8443"
    # потолок как max_memory_restart в ecosystem.config.cjs (2500M) + небольшой запас
    mem_limit: 2560m
    healthcheck:
      # node:22-slim без curl — стучимся встроенным http
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8443/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?задай в .env — см. .env.example}
      POSTGRES_DB: postgres
      NOWYM_USERS_PASSWORD: ${NOWYM_USERS_PASSWORD:?задай в .env — см. .env.example}
      NOWYM_CACHE_PASSWORD: ${NOWYM_CACHE_PASSWORD:?задай в .env — см. .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/sql/docker-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      # ОПЦИОНАЛЬНО. Пока приложение НЕ умеет аутентифицироваться в redis
      # (REDIS_PASSWORD в коде бота не читается) — с непустым паролем бот не
      # подключится. Оставь пустым, пока поддержку не добавят.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", 'exec redis-server ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}']
    volumes:
      - redis-data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", '[ -z "$$REDIS_PASSWORD" ] || export REDISCLI_AUTH="$$REDIS_PASSWORD"; redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
